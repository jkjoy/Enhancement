services:
  qq-official-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: qq-official-bot:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      BOT_DATA_DIR: /data
      BOT_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bot-data:
